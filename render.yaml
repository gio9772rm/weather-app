services:
  - type: web
    name: weather-app-v3
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app_streamlit.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LOCAL_TZ
        value: Europe/Rome
      - key: LOCATION_NAME
        value: Stazione meteo
      - key: LAT
        value: "41.9028"
      - key: LON
        value: "12.4964"
      - key: ELEVATION_M
        value: "20"
