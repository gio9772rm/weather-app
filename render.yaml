services:
  - type: web
    name: weather-app-v3
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app_streamlit.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LOCAL_TZ
        value: Europe/Rome
      - key: LOCATION_NAME
        value: Stazione meteo Roma
      - key: STATION_ID
        value: roma-primary
      - key: LAT
        sync: false
      - key: LON
        sync: false
      - key: ELEVATION_M
        value: "20"
      - key: STATION_STALE_MINUTES
        value: "20"
      - key: OFFICIAL_OBSERVATIONS_ENABLED
        value: "true"
      - key: ARSIAL_OBSERVATIONS_ENABLED
        value: "false"
      - key: ARSIAL_OBSERVATIONS_MODE
        value: auto
      - key: ARSIAL_PROBE_HOURS
        value: "6"
      - key: ARSIAL_STATION_NAME
        value: ROMA Lanciani-SEDE ARSIAL
      - key: ARSIAL_TZ
        value: UTC
      - key: ARSIAL_CACHE_HOURS
        value: "72"
      - key: CFR_OBSERVATIONS_ENABLED
        value: "true"
      - key: CFR_STATION_NAME
        value: Roma Monte Mario
      - key: DPC_RADAR_ENABLED
        value: "true"
      - key: REFERENCE_CLIMATOLOGY_ENABLED
        value: "true"
      - key: ENSEMBLE_FORECAST_ENABLED
        value: "true"
      - key: RADAR_NOWCAST_ENABLED
        value: "true"
      - key: EEA_AIR_OBSERVATIONS_ENABLED
        value: "true"
      - key: EEA_AIR_COUNTRY
        value: IT
      - key: EEA_AIR_CITY
        value: Roma
      - key: FEATURE_CLIMATOLOGY_ENABLED
        value: "true"
      - key: FEATURE_MEASURED_POLLEN_ENABLED
        value: "true"
      - key: FEATURE_OFFICIAL_ALERTS_ENABLED
        value: "true"
      - key: FEATURE_EXPERIENCE_MODE_ENABLED
        value: "true"

  # Acquisizione primaria: Render garantisce una sola esecuzione attiva per
  # questo Cron Job. Il lock PostgreSQL protegge anche da avvii GitHub/locali.
  - type: cron
    name: weather-app
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements-ingest.txt
    startCommand: python ingest_all.py --backfill-hours 2 --max-station-age-minutes 20
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ECOWITT_APPLICATION_KEY
        sync: false
      - key: ECOWITT_API_KEY
        sync: false
      - key: ECOWITT_MAC
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: LOCAL_TZ
        value: Europe/Rome
      - key: LOCATION_NAME
        value: Stazione meteo Roma
      - key: STATION_ID
        value: roma-primary
      - key: LAT
        sync: false
      - key: LON
        sync: false
      - key: ELEVATION_M
        value: "20"
      - key: STATION_BACKFILL_HOURS
        value: "2"
      - key: STATION_AUTO_BACKFILL_MAX_HOURS
        value: "168"
      - key: STATION_MAX_SOURCE_AGE_MINUTES
        value: "20"
      - key: FORECAST_REFRESH_MINUTES
        value: "60"
      - key: OFFICIAL_OBSERVATIONS_ENABLED
        value: "true"
      - key: METAR_STATIONS
        value: LIRF,LIRA
      - key: OFFICIAL_OBSERVATION_REFRESH_MINUTES
        value: "30"
      - key: OFFICIAL_OBSERVATION_LOOKBACK_HOURS
        value: "48"
      - key: OFFICIAL_SCORE_MAX_SHARE
        value: "0.20"
      - key: OFFICIAL_MIN_OVERLAP_SAMPLES
        value: "24"
      - key: ARSIAL_OBSERVATIONS_ENABLED
        value: "false"
      - key: ARSIAL_OBSERVATIONS_MODE
        value: auto
      - key: ARSIAL_PROBE_HOURS
        value: "6"
      - key: ARSIAL_DASHBOARD_URL
        value: https://siarl.arsial.it/bi/superset/dashboard/7
      - key: ARSIAL_STATION_NAME
        value: ROMA Lanciani-SEDE ARSIAL
      - key: ARSIAL_TZ
        value: UTC
      - key: ARSIAL_CACHE_HOURS
        value: "72"
      - key: CFR_OBSERVATIONS_ENABLED
        value: "true"
      - key: CFR_STATION_NAME
        value: Roma Monte Mario
      - key: DPC_RADAR_ENABLED
        value: "true"
      - key: DPC_RADAR_REFRESH_MINUTES
        value: "5"
      - key: REFERENCE_CLIMATOLOGY_ENABLED
        value: "true"
      - key: ENSEMBLE_FORECAST_ENABLED
        value: "true"
      - key: ENSEMBLE_MODEL
        value: icon_seamless
      - key: EEA_AIR_OBSERVATIONS_ENABLED
        value: "true"
      - key: EEA_AIR_COUNTRY
        value: IT
      - key: EEA_AIR_CITY
        value: Roma
      - key: FEATURE_CLIMATOLOGY_ENABLED
        value: "true"
      - key: FEATURE_MEASURED_POLLEN_ENABLED
        value: "true"
      - key: FEATURE_OFFICIAL_ALERTS_ENABLED
        value: "true"
      - key: FEATURE_EXPERIENCE_MODE_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
