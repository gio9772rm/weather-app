name: Meteo V4.4 - Pipeline

on:
  workflow_dispatch:
    inputs:
      force_forecast:
        description: "Aggiorna subito anche le previsioni"
        required: false
        type: boolean
        default: true
  schedule:
    # Rete di sicurezza: Render acquisisce ogni 5 minuti; GitHub rilegge ogni
    # giorno l'intera finestra recuperabile di sette giorni (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: meteo-v3-reconciliation
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ingest.txt

      - name: Check required secrets (values remain masked)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        shell: bash
        run: |
          [ -z "$DATABASE_URL" ] && echo "::error::Manca DATABASE_URL" && exit 2
          ok_app=""
          if [ -n "$ECOWITT_APP_KEY" ] || [ -n "$ECOWITT_APPLICATION_KEY" ]; then ok_app="ok"; fi
          [ -z "$ok_app" ] && echo "::error::Manca ECOWITT_APP_KEY o ECOWITT_APPLICATION_KEY" && exit 2
          [ -z "$ECOWITT_API_KEY" ] && echo "::error::Manca ECOWITT_API_KEY" && exit 2
          [ -z "$ECOWITT_MAC" ] && echo "::error::Manca ECOWITT_MAC" && exit 2
          echo "Required secrets are configured"

      - name: Ingest station and refresh forecasts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY || secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LAT: ${{ vars.LAT || '41.9028' }}
          LON: ${{ vars.LON || '12.4964' }}
          ELEVATION_M: ${{ vars.ELEVATION_M || '20' }}
          LOCATION_NAME: ${{ vars.LOCATION_NAME || 'Stazione meteo' }}
          LOCAL_TZ: Europe/Rome
          STATION_BACKFILL_HOURS: "2"
          STATION_AUTO_BACKFILL_MAX_HOURS: "168"
          STATION_MAX_SOURCE_AGE_MINUTES: "20"
          FORECAST_REFRESH_MINUTES: "60"
          OFFICIAL_OBSERVATIONS_ENABLED: "true"
          METAR_STATIONS: LIRF,LIRA
          OFFICIAL_OBSERVATION_REFRESH_MINUTES: "30"
          OFFICIAL_OBSERVATION_LOOKBACK_HOURS: "48"
          OFFICIAL_SCORE_MAX_SHARE: "0.20"
          OFFICIAL_MIN_OVERLAP_SAMPLES: "24"
          ARSIAL_OBSERVATIONS_ENABLED: "false"
          ARSIAL_DASHBOARD_URL: https://siarl.arsial.it/bi/superset/dashboard/7
          ARSIAL_STATION_NAME: ROMA Lanciani-SEDE ARSIAL
          ARSIAL_TZ: UTC
          ARSIAL_CACHE_HOURS: "72"
          CFR_OBSERVATIONS_ENABLED: "true"
          DPC_RADAR_ENABLED: "true"
          REFERENCE_CLIMATOLOGY_ENABLED: "true"
          STATION_ID: roma-primary
          RECONCILIATION_HOURS: "168"
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        shell: bash
        run: |
          extra=""
          backfill_hours="$STATION_BACKFILL_HOURS"
          if [ "$SCHEDULE_EXPRESSION" = "17 3 * * *" ]; then
            backfill_hours="$RECONCILIATION_HOURS"
            extra="--force-forecast"
            echo "Riconciliazione giornaliera: recupero degli ultimi 7 giorni"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_forecast }}" = "true" ]; then
            extra="--force-forecast"
          fi
          python ingest_all.py --backfill-hours "$backfill_hours" $extra

  notify:
    needs: ingest
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout notification helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sync deduplicated operational issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python operations_alert.py --key cloud-ingest
          --status "${{ needs.ingest.result }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
