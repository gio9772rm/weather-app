name: Meteo V4.3 - Backfill manuale

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Ore da recuperare (1-720; 168 consigliato)'
        required: true
        default: '24'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ingest.txt

      - name: Validate input
        shell: bash
        run: |
          hours="${{ github.event.inputs.hours }}"
          if ! [[ "$hours" =~ ^[0-9]+$ ]] || [ "$hours" -lt 1 ] || [ "$hours" -gt 720 ]; then
            echo "::error::hours deve essere un intero tra 1 e 720"
            exit 2
          fi

      - name: Run backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY || secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
          SECONDARY_STATION_ENABLED: ${{ vars.SECONDARY_STATION_ENABLED || 'false' }}
          SECONDARY_STATION_ID: ${{ vars.SECONDARY_STATION_ID || 'secondary-station' }}
          SECONDARY_STATION_NAME: ${{ vars.SECONDARY_STATION_NAME || 'Stazione secondaria' }}
          SECONDARY_STATION_LAT: ${{ secrets.SECONDARY_STATION_LAT }}
          SECONDARY_STATION_LON: ${{ secrets.SECONDARY_STATION_LON }}
          SECONDARY_STATION_ELEVATION_M: ${{ secrets.SECONDARY_STATION_ELEVATION_M }}
          SECONDARY_STATION_TZ: Europe/Rome
          SECONDARY_ECOWITT_APPLICATION_KEY: ${{ secrets.SECONDARY_ECOWITT_APPLICATION_KEY || secrets.ECOWITT_APPLICATION_KEY || secrets.ECOWITT_APP_KEY }}
          SECONDARY_ECOWITT_API_KEY: ${{ secrets.SECONDARY_ECOWITT_API_KEY }}
          SECONDARY_ECOWITT_MAC: ${{ secrets.SECONDARY_ECOWITT_MAC }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LAT: ${{ vars.LAT || '41.9028' }}
          LON: ${{ vars.LON || '12.4964' }}
          ELEVATION_M: ${{ vars.ELEVATION_M || '20' }}
          LOCAL_TZ: Europe/Rome
          STATION_MAX_SOURCE_AGE_MINUTES: "20"
          STATION_REFRESH_MINUTES: "10"
          OFFICIAL_OBSERVATIONS_ENABLED: "true"
          METAR_STATIONS: LIRF,LIRA
          OFFICIAL_OBSERVATION_LOOKBACK_HOURS: "48"
          OFFICIAL_SCORE_MAX_SHARE: "0.20"
          OFFICIAL_MIN_OVERLAP_SAMPLES: "24"
          ARSIAL_OBSERVATIONS_ENABLED: "false"
          ARSIAL_OBSERVATIONS_MODE: auto
          ARSIAL_PROBE_HOURS: "6"
          ARSIAL_DASHBOARD_URL: https://siarl.arsial.it/bi/superset/dashboard/7
          ARSIAL_STATION_NAME: ROMA Lanciani-SEDE ARSIAL
          ARSIAL_TZ: UTC
          ARSIAL_CACHE_HOURS: "72"
          CFR_OBSERVATIONS_ENABLED: "true"
          DPC_RADAR_ENABLED: "true"
          REFERENCE_CLIMATOLOGY_ENABLED: "true"
          STATION_ID: roma-primary
        run: |
          python ingest_all.py --backfill-hours "${{ github.event.inputs.hours }}" --force-forecast
