name: Meteo V4.4 - Controllo salute

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: meteo-v44-health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install health-check dependencies
        run: pip install -r requirements-ingest.txt

      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Manca DATABASE_URL"
            exit 2
          fi

      - name: Verify database, measurements and forecasts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL || 'https://weather-app-v3-w2jd.onrender.com' }}
          LOCAL_TZ: Europe/Rome
          STATION_STALE_MINUTES: "20"
          FORECAST_REFRESH_MINUTES: "60"
          OFFICIAL_OBSERVATIONS_ENABLED: "true"
          ARSIAL_OBSERVATIONS_ENABLED: "false"
          ARSIAL_OBSERVATIONS_MODE: auto
          ARSIAL_PROBE_HOURS: "6"
          CFR_OBSERVATIONS_ENABLED: "true"
          DPC_RADAR_ENABLED: "true"
          REFERENCE_CLIMATOLOGY_ENABLED: "true"
          ENSEMBLE_FORECAST_ENABLED: "true"
          EEA_AIR_OBSERVATIONS_ENABLED: "true"
          FEATURE_CLIMATOLOGY_ENABLED: "true"
          FEATURE_MEASURED_POLLEN_ENABLED: "true"
          FEATURE_OFFICIAL_ALERTS_ENABLED: "true"
        run: python health_check.py

  notify:
    needs: health
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout notification helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sync deduplicated operational issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python operations_alert.py --key health
          --status "${{ needs.health.result }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
