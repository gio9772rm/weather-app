name: Meteo V4.4 - Backup giornaliero

on:
  workflow_dispatch:
  schedule:
    # Avoid minute 00, when GitHub documents higher schedule delay/drop risk.
    - cron: "7 22 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: read
  issues: write

concurrency:
  group: meteo-v44-daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backup dependencies
        run: pip install -r requirements-ingest.txt

      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Manca DATABASE_URL"
            exit 2
          fi

      - name: Create and verify portable backup
        id: backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backup_database.py \
            --output "$RUNNER_TEMP/meteo-database-${GITHUB_RUN_ID}.zip" \
            --github-output "$GITHUB_OUTPUT"

      - name: Encrypt backup before leaving the runner
        id: encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
          ENCRYPTED_PATH: ${{ steps.backup.outputs.encrypted_path }}
        shell: bash
        run: |
          set +x
          METEO_BACKUP_KEY="$(printf '%s' "$DATABASE_URL" | openssl dgst -sha256 -binary | openssl base64 -A)"
          export METEO_BACKUP_KEY
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -md sha256 \
            -in "$BACKUP_PATH" -out "$ENCRYPTED_PATH" -pass env:METEO_BACKUP_KEY
          unset METEO_BACKUP_KEY
          test -s "$ENCRYPTED_PATH"
          shred -u "$BACKUP_PATH" || rm -f "$BACKUP_PATH"

      - name: Store encrypted backup on GitHub
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteo-db-${{ steps.backup.outputs.local_date }}-${{ github.run_id }}
          path: ${{ steps.backup.outputs.encrypted_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record cloud-backup outcome
        if: ${{ always() && steps.backup.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          BACKUP_ROWS: ${{ steps.backup.outputs.rows }}
          BACKUP_CREATED_AT: ${{ steps.backup.outputs.created_at }}
        shell: bash
        run: |
          if [ "$UPLOAD_OUTCOME" = "success" ]; then
            cloud_status="success"
            cloud_error=""
          else
            cloud_status="error"
            cloud_error="caricamento artefatto GitHub non riuscito"
          fi
          python backup_database.py \
            --record-cloud-status "$cloud_status" \
            --rows "$BACKUP_ROWS" \
            --observed-at "$BACKUP_CREATED_AT" \
            --error "$cloud_error"

  notify:
    needs: backup
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout notification helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sync deduplicated operational issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python operations_alert.py --key daily-backup
          --status "${{ needs.backup.result }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
