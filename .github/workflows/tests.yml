name: Meteo Pro V5 - Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://meteo_test:isolated_ci_only@127.0.0.1:5432/meteo_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Start PostgreSQL 18 with registry fallback
        shell: bash
        run: |
          set -euo pipefail
          # Google's managed cache falls back to Docker Hub on a cache miss.
          # The previous ECR-only service failed before any test could run
          # when its public registry returned "Data limit exceeded".
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          mirrors = config.get('registry-mirrors', [])
          if 'https://mirror.gcr.io' not in mirrors:
              config['registry-mirrors'] = ['https://mirror.gcr.io', *mirrors]
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
          database_image=""
          for candidate in docker.io/library/postgres:18 public.ecr.aws/docker/library/postgres:18; do
            if timeout 90s docker pull "$candidate"; then
              database_image="$candidate"
              break
            fi
            echo "::warning::PostgreSQL image temporarily unavailable from $candidate; trying the alternate registry"
          done
          if [ -z "$database_image" ]; then
            echo "::error::Both PostgreSQL image sources are temporarily unavailable"
            exit 1
          fi
          docker run -d --name meteo-test-postgres \
            -e POSTGRES_DB=meteo_test -e POSTGRES_USER=meteo_test \
            -e POSTGRES_PASSWORD=isolated_ci_only -p 127.0.0.1:5432:5432 \
            --health-cmd "pg_isready -U meteo_test -d meteo_test" \
            --health-interval 2s --health-timeout 5s --health-retries 20 \
            "$database_image"
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' meteo-test-postgres)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs meteo-test-postgres
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lossless history, physical reclaim and concurrent backup snapshot
        run: python -m pytest -q tests/test_compact_history.py tests/test_r2_archive.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          ruff check .
          python privacy_audit.py
      - name: Unit tests
        run: |
          python -m pytest -q
          node --test tests/*.test.cjs

  visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install visual-test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile visual contracts
        run: python visual_regression.py --output visual-artifacts
      - name: Store visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteo-v5-visual-${{ github.run_id }}
          path: visual-artifacts
          if-no-files-found: warn
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Gradle
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256 -o "$RUNNER_TEMP/gradle.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/gradle.sha256")" "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Build and lint unsigned Android release
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest
      - name: Collect official APK signing tools for private local signing
        run: |
          mkdir -p android/app/build/signing-tools
          tools_dir="$(dirname "$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)")"
          cp "$tools_dir/apksigner" "$tools_dir/aapt" android/app/build/signing-tools/
          mkdir -p android/app/build/signing-tools/lib
          cp "$tools_dir/lib/apksigner.jar" android/app/build/signing-tools/lib/
          if [ -d "$tools_dir/lib64" ]; then cp -r "$tools_dir/lib64" android/app/build/signing-tools/; fi
      - name: Save unsigned release and lint results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meteo-pro-android-unsigned-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/release/*unsigned.apk
            android/app/build/reports/lint-results-release.*
            android/app/build/reports/tests/testReleaseUnitTest/
            android/app/build/signing-tools/
          retention-days: 30
